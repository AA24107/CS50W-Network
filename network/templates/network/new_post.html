{% extends "network/layout.html" %}

{% block body %}
<h1>New Post</h1>

<div class="card">
    <div class="card-body">
        <form action="{% url 'new_post' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <textarea class="form-control" type="text" name="content" placeholder="Type here"></textarea>
            </div>
            <input class="btn btn-primary" type="submit" value="Post">
        </form>
    </div>
</div>

{% endblock %}
